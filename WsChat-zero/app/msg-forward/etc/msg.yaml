Name: msg.rpc
ListenOn: 0.0.0.0:9092
Timeout: 30000

Etcd:
  Hosts:
    - localhost:2379
  Key: msg.rpc

Kafka:
  Brokers:
  - 127.0.0.1:19092
  ChatTopic: chat-messages

Mysql:
  DataSource: root:111111@tcp(localhost:3306)/wechat_database?charset=utf8mb4&parseTime=True&loc=Local&tls=false

StoreMode: direct

Telemetry:
  Name: msg.rpc
  Batcher: otlpgrpc
  Endpoint: localhost:4317
  Sampler: 1.0
