<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PPT — 工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶栏 */
        .topbar {
            height: 52px;
            background: #16162a;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }
        .topbar .logo-text {
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar .back-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: rgba(255,255,255,0.5);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .topbar .back-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        /* 主体：左聊右看 */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧：对话区 */
        .chat-panel {
            width: 42%;
            min-width: 380px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.06);
            background: #1e1e36;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 100%;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user { flex-direction: row-reverse; }
        .msg .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .msg.user .avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
        .msg.assistant .avatar { background: rgba(255,255,255,0.08); font-size: 18px; }
        .msg .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .msg.user .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant .bubble {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.85);
            border-bottom-left-radius: 4px;
        }
        .msg .time {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            align-self: flex-end;
            padding-bottom: 4px;
        }
        .msg.user .time { padding-right: 4px; }
        .msg.assistant .time { padding-left: 4px; }

        /* 状态消息 */
        .status-msg {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            padding: 8px;
        }
        .status-msg .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

        /* 进度信息 */
        .progress-info {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .progress-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }
        .progress-tag.done { background: rgba(17, 153, 142, 0.2); color: #38ef7d; }

        /* 聊天输入 */
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 8px;
            background: #1a1a32;
        }
        .chat-input-area input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 16px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus { border-color: rgba(102, 126, 234, 0.4); }
        .chat-input-area input::placeholder { color: rgba(255,255,255,0.25); }
        .chat-input-area .send-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area .send-btn:hover { opacity: 0.85; }
        .chat-input-area .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 右侧：PPT预览区 */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            min-width: 0;
        }

        .preview-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .preview-header h3 {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
        }
        .preview-header .download-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }
        .preview-header .download-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .preview-header .download-btn.show { display: inline-flex; align-items: center; gap: 6px; }

        .preview-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            color: rgba(255,255,255,0.15);
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        /* 缩略图网格 */
        .thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            align-content: start;
            padding: 4px;
        }
        .thumbnails::-webkit-scrollbar { width: 4px; }
        .thumbnails::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .thumb-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .thumb-card:hover {
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .thumb-card .page-num {
            padding: 6px 10px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .thumb-card .page-preview {
            padding: 10px 12px 14px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .thumb-card .page-preview .ptitle {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .thumb-card .page-preview .pcontent {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .thumb-card .page-preview .pbadge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-top: 4px;
            width: fit-content;
        }
        .pbadge.image { background: rgba(102, 126, 234, 0.2); color: #a78bfa; }
        .pbadge.chart { background: rgba(17, 153, 142, 0.2); color: #38ef7d; }

        /* 缩略图导航 */
        .thumb-nav {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            padding: 8px 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .thumb-nav span {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        /* Token信息 */
        .token-bar {
            padding: 6px 16px;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.04);
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            text-align: center;
            flex-shrink: 0;
        }

        @media (max-width: 800px) {
            .main { flex-direction: column; }
            .chat-panel { width: 100%; min-width: 0; max-height: 50vh; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
        }
    </style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
    <button class="back-btn" onclick="window.location.href='/'">← 返回</button>
    <span class="logo-text">📊 AI PPT</span>
</div>

<!-- 主体 -->
<div class="main">
    <!-- 左侧：对话面板 -->
    <div class="chat-panel">
        <div class="chat-messages" id="chatMessages">
            <div class="msg assistant">
                <div class="avatar">🤖</div>
                <div class="bubble">你好！我是 AI PPT 助手。告诉我你想做什么主题的 PPT？</div>
                <span class="time"></span>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="继续对话..." />
            <button class="send-btn" id="chatSendBtn" onclick="sendChat()">➤</button>
        </div>
    </div>

    <!-- 右侧：PPT预览面板 -->
    <div class="preview-panel">
        <div class="preview-header">
            <h3>📄 PPT 预览</h3>
            <a class="download-btn" id="downloadBtn" target="_blank">📥 下载 PPT</a>
        </div>

        <div class="preview-body" id="previewBody">
            <div class="empty-state" id="emptyState">
                <div class="icon">📊</div>
                <p>在左侧输入主题，开始生成 PPT</p>
            </div>
            <div class="thumbnails" id="thumbnails" style="display:none;"></div>
        </div>

        <div class="thumb-nav" id="thumbNav" style="display:none;">
            <span id="pageCount">共 0 页</span>
        </div>

        <div class="token-bar" id="tokenInfo"></div>
    </div>
</div>

<script>
    let currentTaskId = null;
    let slidesData = [];
    let isGenerating = false;
    const SESSION_ID = 'workspace';

    // ====== 初始化 ======
    window.addEventListener('DOMContentLoaded', () => {
        loadHistory();
        const prompt = localStorage.getItem('ppt_prompt');
        if (prompt) {
            localStorage.removeItem('ppt_prompt');
            // 自动发送
            addMessage('user', prompt);
            setTimeout(() => sendToChat(prompt), 300);
        }
        document.getElementById('chatInput').focus();
    });

    // ====== 消息管理 ======
    async function loadHistory() {
        try {
            const res = await fetch('/api/chat/history?sessionId=' + encodeURIComponent(SESSION_ID));
            const data = await res.json();
            if (data.code !== 0 || !data.data) return;
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            const messages = data.data.messages || [];
            messages.forEach((msg) => {
                addMessage(msg.role || 'assistant', msg.content || '', msg.time);
            });
        } catch (err) {
            console.warn('load history failed', err);
        }
    }

    function addMessage(role, content, time) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '👤' : '🤖';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;

        const timeEl = document.createElement('span');
        timeEl.className = 'time';
        timeEl.textContent = time || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

        div.appendChild(role === 'user' ? timeEl : avatar);
        div.appendChild(bubble);
        div.appendChild(role === 'user' ? avatar : timeEl);

        const container = document.getElementById('chatMessages');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addStatusMessage(html) {
        const div = document.createElement('div');
        div.className = 'status-msg';
        div.innerHTML = html;
        document.getElementById('chatMessages').appendChild(div);
        document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        return div;
    }

    // ====== 对话逻辑 ======
    function sendChat() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || isGenerating) return;
        input.value = '';
        addMessage('user', text);
        sendToChat(text);
    }

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });

    async function sendToChat(message) {
        isGenerating = true;
        const btn = document.getElementById('chatSendBtn');
        btn.disabled = true;

        const statusEl = addStatusMessage('🤔 AI 思考中<span class="loading-dots"></span>');

        try {
            const res = await fetch('/api/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: SESSION_ID, message })
            });
            const data = await res.json();

            statusEl.remove();

            if (data.code !== 0) {
                addMessage('assistant', '抱歉，出错了：' + data.message);
                return;
            }

            const result = data.data;
            addMessage('assistant', result.reply);

            // 检查是否需要调用 PPT 工具
            if (result.tool === 'generate_ppt' && result.toolArg) {
                await generatePpt(result.toolArg.topic, result.toolArg.style || '简约');
            }
        } catch (err) {
            statusEl.remove();
            addMessage('assistant', '网络错误，请重试');
        } finally {
            isGenerating = false;
            btn.disabled = false;
            document.getElementById('chatInput').focus();
        }
    }

    // ====== PPT 生成逻辑 ======
    async function generatePpt(topic, style) {
        const statusEl = addStatusMessage('📝 开始生成 PPT：<strong>' + topic + '</strong>，风格：' + style);

        // 生成进度标签
        const progressDiv = document.createElement('div');
        progressDiv.className = 'progress-info';
        progressDiv.innerHTML = `
            <span class="progress-tag">📝 文案生成</span>
            <span class="progress-tag">🖼️ 配图收集</span>
            <span class="progress-tag">🔍 质检</span>
            <span class="progress-tag">📦 合成</span>
        `;
        statusEl.appendChild(progressDiv);

        try {
            const res = await fetch('/api/ppt/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, style })
            });
            const data = await res.json();

            if (data.code !== 0) { throw new Error(data.message); }

            currentTaskId = data.data.taskId;
            addMessage('assistant', `✅ 已开始生成！任务 ID: ${currentTaskId}`);

            // 更新进度
            statusEl.innerHTML = '⏳ PPT 生成中...';
            statusEl.appendChild(progressDiv);

            await pollStatus(currentTaskId, progressDiv);
        } catch (err) {
            statusEl.innerHTML = '❌ 生成失败：' + err.message;
            addMessage('assistant', '生成失败：' + err.message);
        }
    }

    async function pollStatus(taskId, progressDiv) {
        const tags = progressDiv.querySelectorAll('.progress-tag');
        let attempts = 0;

        return new Promise((resolve) => {
            function check() {
                attempts++;
                // 模拟进度动画
                if (attempts < 5 && tags.length > 0) {
                    tags[Math.min(attempts - 1, tags.length - 1)].classList.add('done');
                }

                fetch('/api/ppt/status?taskId=' + taskId)
                    .then(r => r.json())
                    .then(data => {
                        if (data.code !== 0) return;
                        const status = data.data.status;

                        if (status === 'completed') {
                            if (tags.length > 0) tags.forEach(t => t.classList.add('done'));
                            progressDiv.closest('.status-msg').innerHTML = '✅ PPT 生成完成！';
                            addMessage('assistant', '🎉 PPT 已生成完成！点击右侧「下载 PPT」按钮获取文件。');
                            onPptCompleted(taskId);
                            resolve();
                        } else if (status === 'failed') {
                            progressDiv.closest('.status-msg').innerHTML = '❌ 生成失败';
                            addMessage('assistant', '❌ PPT 生成失败：' + (data.data.message || '未知错误'));
                            resolve();
                        } else if (attempts < 60) {
                            setTimeout(check, 3000);
                        } else {
                            progressDiv.closest('.status-msg').innerHTML = '⏰ 生成超时';
                            resolve();
                        }
                    })
                    .catch(() => {
                        if (attempts < 60) setTimeout(check, 3000);
                        else resolve();
                    });
            }
            check();
        });
    }

    // ====== PPT 完成处理 ======
    async function onPptCompleted(taskId) {
        // 显示下载按钮
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = '/api/ppt/download/' + taskId;
        downloadBtn.classList.add('show');

        // 获取预览
        try {
            const res = await fetch('/api/ppt/preview/' + taskId);
            const data = await res.json();
            if (data.code === 0 && data.data && data.data.slides) {
                slidesData = data.data.slides;
                renderThumbnails(slidesData, data.data.totalPage);
            }
        } catch (e) {
            console.warn('preview failed', e);
        }

        // 加载 token 信息
        loadTokenInfo();
    }

    // ====== 缩略图渲染 ======
    function renderThumbnails(slides, total) {
        const container = document.getElementById('thumbnails');
        const emptyState = document.getElementById('emptyState');
        const thumbNav = document.getElementById('thumbNav');

        container.innerHTML = '';
        container.style.display = 'grid';
        emptyState.style.display = 'none';

        slides.forEach((slide, i) => {
            const card = document.createElement('div');
            card.className = 'thumb-card';

            const num = document.createElement('div');
            num.className = 'page-num';
            num.textContent = '第 ' + (i + 1) + ' 页';

            const preview = document.createElement('div');
            preview.className = 'page-preview';

            const title = document.createElement('div');
            title.className = 'ptitle';
            title.textContent = slide.title || '无标题';
            preview.appendChild(title);

            const content = document.createElement('div');
            content.className = 'pcontent';
            content.textContent = slide.content || '';
            preview.appendChild(content);

            if (slide.imageUrl) {
                const badge = document.createElement('span');
                badge.className = 'pbadge image';
                badge.textContent = '🖼️ 配图';
                preview.appendChild(badge);
            }
            if (slide.chart) {
                const badge = document.createElement('span');
                badge.className = 'pbadge chart';
                badge.textContent = '📊 ' + slide.chart;
                preview.appendChild(badge);
            }

            card.appendChild(num);
            card.appendChild(preview);
            container.appendChild(card);
        });

        document.getElementById('pageCount').textContent = '共 ' + (total || slides.length) + ' 页';
        thumbNav.style.display = 'flex';
    }

    // ====== Token 信息 ======
    function loadTokenInfo() {
        fetch('/api/monitor/tokens')
            .then(r => r.json())
            .then(data => {
                if (data.code === 0) {
                    document.getElementById('tokenInfo').textContent = '🪙 ' + data.data;
                }
            })
            .catch(() => {});
    }
</script>
</body>
</html>
