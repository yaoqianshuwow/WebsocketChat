Name: gateway-api
Host: 0.0.0.0
Port: 8888
Timeout: 30000
MaxBytes: 10485760

UserRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: user.rpc
MsgRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: msg.rpc
FriendRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: friend.rpc
FileRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: file.rpc
Redis:
  Host: localhost:6379
  Pass: ""

JwtAuth:
  AccessSecret: ws-chat-zero-secret-key-2026
Mysql:
  DataSource: root:111111@tcp(localhost:3306)/wechat_database?charset=utf8mb4&parseTime=True&loc=Local

Telemetry:
  Name: gateway-api
  Batcher: otlpgrpc
  Endpoint: localhost:4317
  Sampler: 1.0
