services:
  mysql:
    image: mysql:8.0
    container_name: wschat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "111111"
      MYSQL_DATABASE: wechat_database
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - wschat-net

  redis:
    image: redis:7-alpine
    container_name: wschat-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - wschat-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: wschat-etcd
    restart: always
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - wschat-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: wschat-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "19092:19092"
    networks:
      - wschat-net

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: wschat-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - wschat-net

  user-rpc:
    image: wschat-user:latest
    container_name: wschat-user
    restart: always
    depends_on:
      - mysql
      - redis
      - etcd
    ports:
      - "9091:9091"
    networks:
      - wschat-net

  friend-rpc:
    image: wschat-friend:latest
    container_name: wschat-friend
    restart: always
    depends_on:
      - mysql
      - etcd
    ports:
      - "9093:9093"
    networks:
      - wschat-net

  file-rpc:
    image: wschat-file:latest
    container_name: wschat-file
    restart: always
    depends_on:
      - mysql
      - etcd
    ports:
      - "9094:9094"
    networks:
      - wschat-net
    volumes:
      - file-storage:/app/storage/files

  voice-rpc:
    image: wschat-voice:latest
    container_name: wschat-voice
    restart: always
    depends_on:
      - etcd
    ports:
      - "9095:9095"
    networks:
      - wschat-net

  msg-forward:
    image: wschat-msg-forward:latest
    container_name: wschat-msg-forward
    restart: always
    depends_on:
      - mysql
      - kafka
      - etcd
    ports:
      - "9092:9092"
    networks:
      - wschat-net

  msg-store:
    image: wschat-msg-store:latest
    container_name: wschat-msg-store
    restart: always
    depends_on:
      - mysql
      - kafka
      - elasticsearch
    networks:
      - wschat-net

  gateway:
    image: wschat-gateway:latest
    container_name: wschat-gateway
    restart: always
    depends_on:
      - user-rpc
      - friend-rpc
      - file-rpc
      - msg-forward
      - redis
      - etcd
    ports:
      - "80:8888"
    networks:
      - wschat-net

  web:
    image: wschat-web:latest
    container_name: wschat-web
    restart: always
    depends_on:
      - gateway
    ports:
      - "3000:80"
    networks:
      - wschat-net

volumes:
  mysql-data:
  redis-data:
  es-data:
  file-storage:
  etcd-data:

networks:
  wschat-net:
    driver: bridge
