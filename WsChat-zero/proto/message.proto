syntax = "proto3";

package msg;
option go_package = "./pb";

import "common.proto";

message Message {
  int64  id          = 1;
  int64  sender_id   = 2;
  int64  receiver_id = 3;
  int32  chat_type   = 4;
  int32  msg_type    = 5;
  string content     = 6;
  string file_url    = 7;
  int64  file_size   = 8;
  string file_name   = 9;
  int32  status      = 10;
  int64  session_id  = 11;
  int64  created_at  = 12;
}

message SendMessageRequest {
  int64  sender_id   = 1;
  int64  receiver_id = 2;
  int32  chat_type   = 3;
  int32  msg_type    = 4;
  string content     = 5;
  string file_url    = 6;
  int64  file_size   = 7;
  string file_name   = 8;
  int64  session_id  = 9;
}

message GetMessageListRequest {
  int64 session_id = 1;
  int64 page       = 2;
  int64 size       = 3;
  int64 before_id  = 4;
}

message GetGroupMessageListRequest {
  int64 group_id  = 1;
  int64 page      = 2;
  int64 size      = 3;
  int64 before_id = 4;
}

message GetRecentMessagesRequest {
  int64 session_id = 1;
  int64 limit      = 2;
}

message SearchMessagesRequest {
  string keyword    = 1;
  int64  sender_id  = 2;
  int64  session_id = 3;
  int64  start_time = 4;
  int64  end_time   = 5;
  int64  page       = 6;
  int64  size       = 7;
}

message SendMessageResponse {
  int32  code    = 1;
  string message = 2;
  int64  msg_id  = 3;
}

message MessageListResponse {
  int32           code    = 1;
  string          message = 2;
  repeated Message data   = 3;
  int64           total   = 4;
}

service MessageService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessageList(GetMessageListRequest) returns (MessageListResponse);
  rpc GetGroupMessageList(GetGroupMessageListRequest) returns (MessageListResponse);
  rpc GetRecentMessages(GetRecentMessagesRequest) returns (MessageListResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (MessageListResponse);
}
