version: '3.8'

services:
  # ── 基础设施 ──
  mysql:
    image: mysql:8.0
    container_name: wschat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "111111"
      MYSQL_DATABASE: wechat_database
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - wschat-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wschat-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - wschat-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: wschat-etcd
    restart: always
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - wschat-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: wschat-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "19092:9092"
    networks:
      - wschat-net

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: wschat-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - wschat-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: wschat-jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - wschat-net

  # ── 业务子服务 ──
  user-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.user
    container_name: wschat-user
    restart: always
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "9091:9091"
    networks:
      - wschat-net

  friend-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.friend
    container_name: wschat-friend
    restart: always
    depends_on:
      mysql:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "9093:9093"
    networks:
      - wschat-net

  file-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.file
    container_name: wschat-file
    restart: always
    depends_on:
      mysql:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "9094:9094"
    networks:
      - wschat-net
    volumes:
      - file-storage:/app/storage/files

  voice-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.voice
    container_name: wschat-voice
    restart: always
    depends_on:
      etcd:
        condition: service_started
    ports:
      - "9095:9095"
    networks:
      - wschat-net

  msg-forward:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.msg-forward
    container_name: wschat-msg-forward
    restart: always
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "9092:9092"
    networks:
      - wschat-net

  msg-store:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.msg-store
    container_name: wschat-msg-store
    restart: always
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - wschat-net

  ppt-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ppt-agent
    container_name: wschat-ppt-agent
    restart: always
    ports:
      - "8123:8123"
    volumes:
      - ppt-output:/app/output
      - ppt-storage:/app/storage
    networks:
      - wschat-net

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: wschat-gateway
    restart: always
    depends_on:
      - user-rpc
      - friend-rpc
      - file-rpc
      - msg-forward
      - redis
      - etcd
    ports:
      - "80:8888"
    networks:
      - wschat-net

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: wschat-web
    restart: always
    depends_on:
      - gateway
    ports:
      - "3000:80"
    networks:
      - wschat-net

volumes:
  mysql-data:
  redis-data:
  es-data:
  file-storage:
  etcd-data:
  ppt-output:
  ppt-storage:

networks:
  wschat-net:
    driver: bridge
